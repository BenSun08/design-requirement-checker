name: Windows regression reproduction

on:
  push:
    branches: [fix/windows-test-regressions]

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run unchanged focused tests and diagnostic probes
        shell: python
        run: |
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          def run(args, env=None):
              print("COMMAND:", args, flush=True)
              result = subprocess.run(args, env=env, capture_output=True, text=True, timeout=180)
              print("RETURN CODE:", result.returncode, flush=True)
              print("STDOUT:\n" + result.stdout, flush=True)
              print("STDERR:\n" + result.stderr, flush=True)
              return result.returncode

          run([sys.executable, "-m", "pytest", "tests/test_startup.py", "-vv", "-s"])
          run([sys.executable, "-m", "pytest", "tests/test_ui.py::TestBackgroundImport::test_stale_import_does_not_clear_current_thread_refs", "-vv", "-s"])
          run([sys.executable, "-m", "pytest", "tests/test_startup.py::TestImportWorkflowStaysAlive::test_startup_then_import_then_verify_keeps_process_alive", "-vv", "-s"])

          # Diagnostic-only plugin: report child output even on success, and
          # observe lifecycle boundaries without changing Qt connections.
          probe = Path(tempfile.mkdtemp())
          (probe / "windows_probe.py").write_text('''
          import os
          import subprocess
          from pathlib import Path
          import pytest

          @pytest.fixture(autouse=True)
          def child_diagnostics(monkeypatch, tmp_path):
              original = subprocess.run
              def observed(args, **kwargs):
                  args = list(args)
                  if len(args) > 2 and args[1] == "-c":
                      script = args[2]
                      if "stage =" in script:
                          diagnostic = """
          def trace(frame, event, arg):
              name = frame.f_code.co_name
              if event in ("call", "return") and name in ("step_import", "poll_ready", "poll_completed", "_on_thread_finished", "_finish_operation"):
                  w = frame.f_locals.get("self")
                  threads = [(t.isRunning(), t.isFinished()) for t in w._active_threads] if w is not None else []
                  print("TRACE", event, name, "stage", stage, "threads", threads, flush=True)
              return trace
          sys.settrace(trace)
          """
                          script = script.replace("def find_window():", diagnostic + "\\ndef find_window():")
                      if os.environ.get("PROBE_POPULATED") and "TEST_BASELINE_PATH" not in script:
                          prefix = """
          from pathlib import Path
          from design_requirement_checker.baseline_store import save_baseline
          from design_requirement_checker.domain import CheckItem
          import design_requirement_checker.__main__ as entry
          path = Path(__import__("os").environ["PROBE_BASELINE"])
          save_baseline(path, (CheckItem(item_id="probe", code="P", name="probe", detection_phrase="probe"),), "probe")
          entry.default_path = lambda: path
          """
                          script = prefix + script
                      args[2] = script
                  result = original(args, **kwargs)
                  print("CHILD RETURN CODE", result.returncode, flush=True)
                  print("CHILD STDOUT", result.stdout, flush=True)
                  print("CHILD STDERR", result.stderr, flush=True)
                  return result
              monkeypatch.setattr(subprocess, "run", observed)
          ''', encoding="utf-8")
          env = {**os.environ, "PYTHONPATH": str(probe), "PYTEST_PLUGINS": "windows_probe", "PYTHONUNBUFFERED": "1", "PYTHONFAULTHANDLER": "1"}
          for attempt in range(20):
              print("WORKFLOW DIAGNOSTIC ATTEMPT", attempt + 1, flush=True)
              if run([sys.executable, "-m", "pytest", "tests/test_startup.py::TestImportWorkflowStaysAlive::test_startup_then_import_then_verify_keeps_process_alive", "-vv", "-s"], env):
                  break
          env.update(PROBE_POPULATED="1", PROBE_BASELINE=str(probe / "baseline.json"))
          run([sys.executable, "-m", "pytest", "tests/test_startup.py::test_startup_shows_window_and_exits_when_closed", "-vv", "-s"], env)
          for attempt in range(5):
              print("FULL SUITE ATTEMPT", attempt + 1, flush=True)
              if run([sys.executable, "-m", "pytest", "-vv", "-s"], {**os.environ, "PYTHONFAULTHANDLER": "1"}):
                  break
