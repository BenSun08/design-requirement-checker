name: Build Windows portable application

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 PyInstaller onedir
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Install project, development, and Windows build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,build-windows]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run quality checks
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src
          python -m pip check

      - name: Build portable onedir application
        run: python -m PyInstaller --clean --noconfirm packaging/windows/design-requirement-checker.spec

      - name: Verify packaged executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DesignRequirementChecker/DesignRequirementChecker.exe")) {
            throw "Expected packaged executable was not produced."
          }

      - name: Upload portable application
        uses: actions/upload-artifact@v7
        with:
          name: DesignRequirementChecker-windows-x64-onedir
          path: dist/DesignRequirementChecker/
          if-no-files-found: error
